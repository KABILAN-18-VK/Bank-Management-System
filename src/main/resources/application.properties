spring.application.name=banking-management-system

# Server Port
server.port=8080

# ===================================================================
# CURRENT DATABASE: H2 In-Memory Database (Default for Development)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Secrets
app.jwt.secret=BankManagementSecretKeyForJwtSigningMustBeVeryLongAndSecure123456!
app.jwt.expiration-ms=86400000

