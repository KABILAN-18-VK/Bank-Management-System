spring.application.name=banking-management-system

# Server Port
server.port=8080

# ===================================================================
# MYSQL DATABASE CONFIGURATION
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/banking_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Secrets
app.jwt.secret=BankManagementSecretKeyForJwtSigningMustBeVeryLongAndSecure123456!
app.jwt.expiration-ms=86400000

# Disable H2 Console for production MySQL mode
spring.h2.console.enabled=false
